version: '3.8'

services:
  web:
    build: .
    image: dashboard:latest
    container_name: dashboard_web
    command: ash -c "rm -f tmp/pids/server.pid && rails server -b 0.0.0.0"
    environment:
      ML_SERVICE_URL: http://ml-service:5000
      RAILS_ENV: development
      PG_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      PROMETHEUS_URL: http://prometheus:9090
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dashboard-storage
      ML_MODELS_BUCKET: ml-models
      REPORTS_BUCKET: reports
      STORAGE_SERVICE: minio
    volumes:
      - .:/app
    tty: true
    stdin_open: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - dashboard_net
    restart: unless-stopped

  sidekiq:
    image: dashboard:latest
    container_name: dashboard_sidekiq
    command: bundle exec sidekiq -q ml -q default
    working_dir: /app
    environment:
      RAILS_ENV: development
      PG_HOST: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: dashboard-storage
      ML_MODELS_BUCKET: ml-models
      REPORTS_BUCKET: reports
      STORAGE_SERVICE: minio
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - dashboard_net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dashboard_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: dashboard_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/dashboard-storage;
      mc mb --ignore-existing myminio/ml-models;
      mc mb --ignore-existing myminio/reports;
      mc anonymous set download myminio/dashboard-storage;
      exit 0;
      "
    networks:
      - dashboard_net

  postgres:
    image: postgres:15-alpine
    container_name: dashboard_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: dashboard_db
      PGDATA: /var/lib/postgresql/data
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - dashboard_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dashboard_redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - dashboard_net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dashboard_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - dashboard_net
    depends_on:
      - web
      - postgres-exporter
      - redis-exporter
      - node-exporter
      - pushgateway
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: dashboard_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:123456@postgres:5432/dashboard_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - dashboard_net
    depends_on:
      - postgres
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: dashboard_redis_exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    networks:
      - dashboard_net
    depends_on:
      - redis
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dashboard_node_exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - dashboard_net
    restart: unless-stopped

  pushgateway:
    image: prom/pushgateway:latest
    container_name: dashboard_pushgateway
    ports:
      - "9091:9091"
    networks:
      - dashboard_net
    restart: unless-stopped

  ml-service:
    build:
      context: ./modules/AI_api
      dockerfile: Dockerfile
    container_name: ml-service
    ports:
      - "5000:5000"
    volumes:
      - ./modules/AI_api:/app
    networks:
      - dashboard_net
    restart: unless-stopped

networks:
  dashboard_net:
    driver: bridge

volumes:
  db-data:
  redis-data:
  prometheus-data:
  ollama-data:
  minio-data:
