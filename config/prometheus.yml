global:
  scrape_interval: 15s               # Set the global scrape interval to 15 seconds for timely metrics (default was 1m).
  evaluation_interval: 15s           # Evaluate rules every 15 seconds (aligns with scrape_interval for consistency).
  # scrape_timeout is not explicitly set here; it defaults to 10s which is usually sufficient.

scrape_configs:
  # Сбор метрик PostgreSQL через экспортер postgres_exporter
  - job_name: 'postgresql'
    scrape_interval: 30s            # опрашивать PostgreSQL реже (30 сек) для снижения нагрузки на БД
    scrape_timeout: 10s             # таймаут опроса PostgreSQL экспортерa
    static_configs:
      - targets: ['postgres-exporter:9187']  # Используем имя контейнера postgres-exporter вместо localhost
        labels:
          service: 'database'
          database: 'postgresql'

  # Сбор метрик Redis через экспортер redis_exporter
  - job_name: 'redis'
    scrape_interval: 15s            # интервал опроса Redis (можно увеличить при высокой нагрузке)
    scrape_timeout: 5s              # таймаут опроса Redis экспортерa (Redis отвечает быстро, 5 сек достаточно)
    static_configs:
      - targets: ['redis-exporter:9121']  # Используем имя контейнера redis-exporter вместо localhost
        labels:
          service: 'cache'
          database: 'redis'
          
  # Собственные метрики Prometheus
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']  # Prometheus собирает свои собственные метрики 