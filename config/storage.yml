test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# MinIO для локальной разработки (S3-совместимое хранилище)
minio:
  service: S3
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', 'minioadmin') %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', 'minioadmin') %>
  region: us-east-1
  bucket: <%= ENV.fetch('MINIO_BUCKET', 'dashboard-storage') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', 'http://minio:9000') %>
  force_path_style: true

# Production S3 (AWS или совместимый)
amazon:
  service: S3
  access_key_id: <%= ENV.fetch('AWS_ACCESS_KEY_ID', '') %>
  secret_access_key: <%= ENV.fetch('AWS_SECRET_ACCESS_KEY', '') %>
  region: <%= ENV.fetch('AWS_REGION', 'us-east-1') %>
  bucket: <%= ENV.fetch('AWS_BUCKET', 'dashboard-storage-prod') %>
  <% if ENV['AWS_ENDPOINT'].present? %>
  endpoint: <%= ENV['AWS_ENDPOINT'] %>
  force_path_style: true
  <% end %>

# Для хранения ML моделей (отдельный bucket)
ml_models:
  service: S3
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', ENV.fetch('AWS_ACCESS_KEY_ID', 'minioadmin')) %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', ENV.fetch('AWS_SECRET_ACCESS_KEY', 'minioadmin')) %>
  region: us-east-1
  bucket: <%= ENV.fetch('ML_MODELS_BUCKET', 'ml-models') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', ENV.fetch('AWS_ENDPOINT', 'http://minio:9000')) %>
  force_path_style: true

# Для отчётов (отдельный bucket)
reports:
  service: S3
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', ENV.fetch('AWS_ACCESS_KEY_ID', 'minioadmin')) %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', ENV.fetch('AWS_SECRET_ACCESS_KEY', 'minioadmin')) %>
  region: us-east-1
  bucket: <%= ENV.fetch('REPORTS_BUCKET', 'reports') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', ENV.fetch('AWS_ENDPOINT', 'http://minio:9000')) %>
  force_path_style: true
