global:
  scrape_interval: 15s               # Set the global scrape interval to 15 seconds for timely metrics (default was 1m).
  evaluation_interval: 15s           # Evaluate rules every 15 seconds (aligns with scrape_interval for consistency).
  # scrape_timeout is not explicitly set here; it defaults to 10s which is usually sufficient.

scrape_configs:
  # ... (other scrape_configs for existing exporters or services can be listed here) ...

  # Scrape metrics from the Rails dashboard application
  - job_name: 'rails_dashboard'      # Descriptive job name for the Rails app (appears in the `job` label for these metrics).
    scrape_interval: 15s            # Poll the Rails app every 15 seconds (optimal for app metrics; adjust if needed for performance).
    scrape_timeout: 10s             # Timeout after 10 seconds if the app doesn’t respond (prevents hanging scrapes).
    metrics_path: '/metrics'        # Path where the Rails app exposes Prometheus metrics (common default path for Rails instrumentation).
    scheme: http                    # Use HTTP to scrape (change to https if your metrics endpoint is served over TLS).
    static_configs:
      - targets: ['localhost:3000'] # Target endpoint for the Rails app metrics. Replace with the host:port of your Rails app (e.g., 'dashboard.example.com:3000' or service DNS).
        # If the Rails app runs multiple instances, list each instance here (or use service discovery) to scrape all of them.
    
    # Сбор метрик PostgreSQL через экспортер postgres_exporter
  - job_name: 'postgresql'
    scrape_interval: 30s       # опрашивать PostgreSQL реже (30 сек) для снижения нагрузки на БД
    scrape_timeout: 10s        # таймаут опроса PostgreSQL экспортерa
    static_configs:
      - targets: ['localhost:9187']  # адрес postgres_exporter (порт по умолчанию 9187)

  # Сбор метрик Redis через экспортер redis_exporter
  - job_name: 'redis'
    scrape_interval: 15s       # интервал опроса Redis (можно увеличить при высокой нагрузке)
    scrape_timeout: 5s         # таймаут опроса Redis экспортерa (Redis отвечает быстро, 5 сек достаточно)
    static_configs:
      - targets: ['localhost:9121']  # адрес redis_exporter (порт по умолчанию 9121)