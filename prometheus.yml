global:
  scrape_interval: 30s               # Увеличиваем глобальный интервал сбора метрик до 30 секунд
  evaluation_interval: 30s           # Увеличиваем интервал оценки правил до 30 секунд
  # scrape_timeout is not explicitly set here; it defaults to 10s which is usually sufficient.

scrape_configs:
  # Scrape metrics from the Rails dashboard application
  - job_name: 'rails_dashboard'      # Descriptive job name for the Rails app (appears in the `job` label for these metrics).
    scrape_interval: 30s            # Увеличиваем интервал до 30 секунд
    scrape_timeout: 10s             # Timeout after 10 seconds if the app doesn't respond (prevents hanging scrapes).
    metrics_path: '/metrics'        # Path where the Rails app exposes Prometheus metrics (common default path for Rails instrumentation).
    scheme: http                    # Use HTTP to scrape (change to https if your metrics endpoint is served over TLS).
    static_configs:
      - targets: ['web:3000']       # Используем имя контейнера web вместо localhost
        labels:
          service: 'dashboard'
          application: 'rails'
    
  # Сбор метрик PostgreSQL через экспортер postgres_exporter
  - job_name: 'postgresql'
    scrape_interval: 60s            # Увеличиваем интервал до 60 секунд
    scrape_timeout: 10s             # таймаут опроса PostgreSQL экспортерa
    static_configs:
      - targets: ['postgres-exporter:9187']  # Используем имя контейнера postgres-exporter вместо localhost
        labels:
          service: 'database'
          database: 'postgresql'

  # Сбор метрик Redis через экспортер redis_exporter
  - job_name: 'redis'
    scrape_interval: 60s            # Увеличиваем интервал до 60 секунд
    scrape_timeout: 5s              # таймаут опроса Redis экспортерa (Redis отвечает быстро, 5 сек достаточно)
    static_configs:
      - targets: ['redis-exporter:9121']  # Используем имя контейнера redis-exporter вместо localhost
        labels:
          service: 'cache'
          database: 'redis'
          
  # Собственные метрики Prometheus
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']  # Prometheus собирает свои собственные метрики
        labels:
          service: 'monitoring'
          
  # Сбор метрик с node-exporter (системные метрики)
  - job_name: 'node'
    scrape_interval: 60s            # Увеличиваем интервал до 60 секунд
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          instance: 'server1'
          
  # Сбор метрик из Pushgateway
  - job_name: 'pushgateway'
    scrape_interval: 30s
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'pushgateway'

  # Специальный job для метрик приложения из Pushgateway
  - job_name: 'app_metrics'
    scrape_interval: 15s
    honor_labels: true
    metrics_path: '/metrics'
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'app'

# Используем файл с правилами оповещений
rule_files:
  - 'alerts.yml'