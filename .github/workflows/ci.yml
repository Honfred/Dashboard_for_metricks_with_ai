name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: dashboard_for_metricks_with_ai_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y google-chrome-stable curl libjemalloc2 libvips

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          PG_HOST: localhost
          DATABASE_URL: postgres://postgres:123456@localhost:5432/dashboard_for_metricks_with_ai_test
          # Фиктивные хосты: все внешние запросы в тестах перехватывает WebMock
          PROMETHEUS_URL: http://prometheus.test:9090
          ML_SERVICE_URL: http://ml.test:5000
          AI_SERVICE_URL: http://ml.test:5000
          # Явный путь к браузеру для cuprite (см. spec/support/capybara.rb)
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          bin/rails db:test:prepare
          bundle exec rspec

      - name: Extract coverage percent
        id: coverage
        run: |
          if [ ! -f coverage/.last_run.json ]; then
            echo "coverage/.last_run.json не найден — пропускаю"
            exit 0
          fi
          PERCENT=$(ruby -rjson -e 'puts JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line").round(1)')
          echo "percent=$PERCENT" >> "$GITHUB_OUTPUT"
          echo "Line coverage: $PERCENT%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

      # Badge живёт в gist и рендерится через shields.io endpoint.
      # Нужны: секрет GIST_SECRET (token с правом gist) и repo-переменная
      # COVERAGE_GIST_ID (id заранее созданного gist) — см. README
      - name: Update coverage badge
        if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.COVERAGE_GIST_ID != ''
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: dashboard-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          valColorRange: ${{ steps.coverage.outputs.percent }}
          minColorRange: 50
          maxColorRange: 90

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: |
            ${{ github.workspace }}/tmp/screenshots
            ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore
